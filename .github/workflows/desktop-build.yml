name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Unsigned macOS builds: never discover a Developer ID identity.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # Tag pushes only: a mismatched version fails here, before any build minutes
  # or Android signing secrets are used. Other runs skip it and continue.
  verify:
    name: Check versions match the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version-sync.mjs --tag "$TAG"

  build:
    name: Build ${{ matrix.name }}
    needs: [verify]
    # Runs when verify passed or was skipped (non-tag runs); not after a failure.
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: open-record-linux-x64
            builder_args: --linux --x64
            update_feed: latest-linux.yml
          - name: windows-x64
            os: windows-2025
            platform: win32
            arch: x64
            artifact: open-record-windows-x64
            builder_args: --win --x64
            update_feed: latest.yml
          # macOS is currently skipped: GitHub rejects the macos-14 runner
          # configuration for this repo ("not supported"). Re-add the
          # macos-arm64 / macos-x64 entries once a macOS runner works.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build web app, server and desktop main/preload
        run: npm run desktop:build
        env:
          NX_DAEMON: 'false'

      - name: Fetch and verify pinned yt-dlp/ffmpeg
        run: >-
          node apps/desktop/scripts/fetch-binaries.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
        env:
          # Optional stable mirror for pinned assets (flat layout; see the
          # script header). Set the repository variable when BtbN's dated
          # ffmpeg tag or GitHub release retention becomes a problem.
          OPEN_RECORD_BINARIES_BASE: ${{ vars.OPEN_RECORD_BINARIES_BASE }}

      - name: Stage server with the committed lockfile
        run: node apps/desktop/scripts/stage-server.mjs

      - name: Stage Electron app directory
        run: node apps/desktop/scripts/stage-app.mjs

      - name: Ad-hoc sign bundled media binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist/apps/desktop/bin/yt-dlp
          codesign --force --sign - dist/apps/desktop/bin/ffmpeg

      - name: Build installers
        run: >-
          npx electron-builder
          --config apps/desktop/electron-builder.yml
          --publish never
          ${{ matrix.builder_args }}

      # electron-updater trusts the feed file: a feed that names a missing
      # installer, or lacks a sha512, would ship a broken update.
      - name: Verify update feed matches the built installers
        run: node scripts/check-update-metadata.mjs dist/apps/desktop/release ${{ matrix.update_feed }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # latest*.yml and blockmaps are the electron-updater feed: they must
          # be attached to the release next to the installers they describe.
          path: |
            dist/apps/desktop/release/*.AppImage
            dist/apps/desktop/release/*.deb
            dist/apps/desktop/release/*.exe
            dist/apps/desktop/release/*.dmg
            dist/apps/desktop/release/latest*.yml
            dist/apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    needs: [verify]
    # Only release tags and manual runs from the default branch may use the
    # signing secrets. Other runs never reach the secrets.
    if: >-
      always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The `release` environment holds the ANDROID_* secrets and is restricted to
    # v* tags and main (see docs/releasing.md).
    environment: release
    # Signing secrets are read only inside steps. If they are missing, manual
    # runs skip the build quietly; a v* tag fails here, so the release job
    # never publishes a release without the APK.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Missing Android signing secrets: ${missing[*]}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release tag build needs the Android signing secrets: ${missing[*]}"
            exit 1
          fi
          echo "::notice::Skipping Android build on a non-release run."

      - name: Set up JDK 21
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/app/android/**/*.gradle*

      - name: Set up Node.js 24
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies
        if: steps.signing.outputs.ready == 'true'
        run: npm ci

      - name: Build web app and sync Capacitor (same as android:release)
        if: steps.signing.outputs.ready == 'true'
        run: npm run cap:sync
        env:
          NX_DAEMON: 'false'

      - name: Write release keystore and keystore.properties
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          # Each secret must be one line (see docs/releasing.md). A newline would
          # corrupt keystore.properties, so fail before writing anything.
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            value="${!name}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::$name must be a single line (remove any line breaks from the secret)."
              exit 1
            fi
          done

          # The keystore lives in RUNNER_TEMP, outside the repository, as
          # build.gradle requires.
          keystore="$RUNNER_TEMP/open-record-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"

          # Fail fast with a clear message if the secret did not decode to a
          # valid keystore (truncated or re-wrapped paste, wrong password or
          # alias). Prints only the size and magic bytes, never secret values.
          echo "Decoded keystore: $(stat -c %s "$keystore") bytes, magic $(head -c 4 "$keystore" | xxd -p)"
          if ! keytool -list -keystore "$keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore secret is invalid: expected a JKS (magic feedfeed), the store password, and the alias to match. Re-create ANDROID_KEYSTORE_BASE64 with: base64 -w0 <keystore> | gh secret set ANDROID_KEYSTORE_BASE64 --env release"
            exit 1
          fi

          # Java properties: escape backslashes in values.
          escape() {
            local value="$1"
            printf '%s' "${value//\\/\\\\}"
          }

          {
            echo "storeFile=$keystore"
            echo "storePassword=$(escape "$ANDROID_KEYSTORE_PASSWORD")"
            echo "keyAlias=$(escape "$ANDROID_KEY_ALIAS")"
            echo "keyPassword=$(escape "$ANDROID_KEY_PASSWORD")"
          } > apps/app/android/keystore.properties

      - name: Build release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/app/android
        run: ./gradlew assembleRelease

      - name: Rename release APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          src=apps/app/android/app/build/outputs/apk/release/app-release.apk
          test -f "$src"
          mkdir -p dist/android-release
          mv "$src" dist/android-release/OpenRecord-android.apk

      # The app refuses to install an APK it cannot verify, so every release
      # must publish this checksum file next to the APK.
      - name: Generate and verify APK SHA-256 checksum
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd dist/android-release
          sha256sum OpenRecord-android.apk > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Upload APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: open-record-android
          path: |
            dist/android-release/OpenRecord-android.apk
            dist/android-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/open-record-release.jks" apps/app/android/keystore.properties

  release:
    name: Upload installers to the GitHub release
    # Only tags publish. Matrix jobs never touch the release, so there are no
    # concurrent uploads/races between platforms.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version-sync.mjs --tag "$TAG"

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify expected release assets
        run: |
          set -euo pipefail
          expected=(
            OpenRecord-linux-x86_64.AppImage
            OpenRecord-linux-amd64.deb
            OpenRecord-windows-x64.exe
            OpenRecord-android.apk
            SHA256SUMS
            latest.yml
            latest-linux.yml
          )
          for file in "${expected[@]}"; do
            if [ ! -s "release-assets/$file" ]; then
              echo "::error::Missing release asset: $file"
              exit 1
            fi
          done

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The in-app updater shows this body as the release notes, so it is the
      # "What's new" section of RELEASE_NOTES.md (plain markdown only).
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v tag="${TAG#v}" '
            /^## What.s new in v/ { on = index($0, "v" tag) > 0; next }
            /^## / { on = 0 }
            on { print }
          ' RELEASE_NOTES.md > release-notes-body.md
          if [ ! -s release-notes-body.md ]; then
            echo "::error::No 'What's new in v${TAG#v}' section in RELEASE_NOTES.md"
            exit 1
          fi
          cat release-notes-body.md

      - name: Upload assets to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
