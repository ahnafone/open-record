@if (isDesktop()) {
<or-sidebar class="sidebar" />
}

@if (!isDesktop() || !screen().data.root) {
<or-top-bar
  [root]="screen().data.root"
  [title]="title()"
  [backIcon]="screen().data.screen === 'now-playing' ? 'chev-down' : 'back'"
  [backLabel]="screen().data.screen === 'now-playing' ? 'Close player' : 'Back'"
  (back)="back()"
  (menu)="drawerOpen.set(true)"
/>
}

<main
  #screenHost
  class="screen-host"
  [class.narrow]="narrow()"
  [attr.aria-label]="screen().data.title ?? null"
>
  <router-outlet />
</main>

@if (panelShown()) {
<div
  class="np-grip"
  role="separator"
  aria-orientation="vertical"
  tabindex="0"
  aria-label="Resize Now Playing panel"
  aria-controls="or-np-panel"
  [attr.aria-valuemin]="npPanelMinWidth"
  [attr.aria-valuemax]="npPanelMaxWidth()"
  [attr.aria-valuenow]="npPanelWidth()"
  [attr.aria-valuetext]="npPanelWidth() + ' pixels'"
  [class.dragging]="resizing()"
  (pointerdown)="startPanelResize($event)"
  (pointermove)="movePanelResize($event)"
  (pointerup)="endPanelResize($event)"
  (pointercancel)="endPanelResize($event)"
  (lostpointercapture)="endPanelResize($event)"
  (keydown)="onPanelResizeKeydown($event)"
  (dblclick)="resetPanelWidth()"
></div>
<aside
  id="or-np-panel"
  class="np-panel"
  aria-label="Now playing"
  [style.inline-size.px]="npPanelWidth()"
>
  @if (nowPlayingPanel(); as page) {
  <ng-container *ngComponentOutlet="page; inputs: { panel: true }" />
  }
</aside>
}

<div #dock class="dock">
  @if (isDesktop()) {
  <or-player-bar
    [panelOpen]="panelShown() || onNowPlaying()"
    (togglePanel)="toggleNowPlaying()"
  />
  } @else {
  @if (player.current()) {
  <or-mini-player (open)="openNowPlaying()" />
  }
  <or-tab-bar />
  }
</div>

@if (!isDesktop()) {
<or-drawer [(open)]="drawerOpen" />
}

@if (signInPrompt(); as prompt) {
<ng-container *ngComponentOutlet="prompt" />
}

<or-toast-host />

<or-device-picker />
<or-source-fix-dialog />
