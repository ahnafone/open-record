# Normally started with the helper, from the repository root:
#   npm run server:up
# It detects your LAN IP, starts this compose file, and prints the URL, access
# token and a QR code to scan in the app (Settings, Download server).
#
# Manual start (set BIND_ADDRESS to the LAN IP and PUBLIC_URL to the URL phones use):
#   BIND_ADDRESS=192.168.1.20 PUBLIC_URL=http://192.168.1.20:8787 \
#     docker compose -f apps/server/docker-compose.yml up -d --build
services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.10.21}
    image: open-record-server
    restart: unless-stopped
    environment:
      # Optional. When unset, the token is generated once and kept in the
      # server-data volume (/data/token), so it survives restarts.
      OPEN_RECORD_TOKEN: ${OPEN_RECORD_TOKEN:-}
      OPEN_RECORD_DATA_DIR: /data
      # URL phones use, printed in the startup banner and QR code.
      PUBLIC_URL: ${PUBLIC_URL:-}
      PORT: 8787
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      # Host address to publish on. Default 127.0.0.1 (this machine only; expose
      # through an HTTPS tunnel, see README). For plain HTTP on a home LAN set
      # BIND_ADDRESS to the machine's LAN IP (e.g. 192.168.1.20) or 0.0.0.0.
      # LAN traffic is unencrypted: anyone on the network can read the token.
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787'
    volumes:
      - server-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  server-data:
