# Supabase CLI config for local development (`npx supabase start` from the
# repository root). Only the settings Open Record relies on are listed; the
# CLI fills in defaults for everything else. A hosted project uses the same
# migrations (`npx supabase db push`).
project_id = "open-record"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Local email testing UI (confirmation and password reset emails land here).
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Web dev server; native builds sign in with email + password (no redirect).
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200", "capacitor://localhost", "http://localhost"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
# Local only: sign in straight after sign-up. Turn on for hosted projects.
enable_confirmations = false
