<!doctype html>
<!--
  OpenRecord — a frozen high-fidelity interactive mobile mockup for a vintage
  vinyl record shop. One cohesive iOS/Android flow presented inside the Open
  Design OD Next iPhone handset shell. All audio and artwork are local,
  public-domain or openly licensed Wikimedia Commons files (see ATTRIBUTION.md).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>OpenRecord — vinyl listening room</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-icon { display:inline-block; inline-size:var(--od-icon-size,1em); block-size:var(--od-icon-size,1em); flex:none; }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

    /* ===== Open Design OD Next iPhone shell (device frame only) ===== */
    :root {
      --phone-screen-width: 393px;
      --phone-screen-height: 852px;
      --phone-bezel: 12px;
      --phone-outer-radius: 60px;
      --phone-screen-radius: 48px;
      --phone-safe-top: 59px;
      --phone-safe-bottom: 34px;
      --phone-system-fg: #f5f0e6;
      --phone-screen-bg: #171b20;
      --phone-stage-bg: #0f1216;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 12%, rgba(255,141,131,.10), transparent 46%),
        radial-gradient(circle at 50% 2%, rgba(255,255,255,.035), transparent 30%),
        var(--phone-stage-bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      color: #17181a;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.18), transparent 17%),
        linear-gradient(160deg, #3a3a3d 0%, #1d1d20 47%, #09090b 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.9),
        0 34px 70px -20px rgba(0,0,0,.55),
        0 12px 28px -12px rgba(0,0,0,.36);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 102px;
      bottom: 102px;
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,.13) 12%,
        transparent 22%,
        transparent 78%,
        rgba(255,255,255,.08) 90%,
        transparent
      );
    }
    .phone-frame::before { left: -1px; }
    .phone-frame::after { right: -1px; }

    .hardware-button {
      position: absolute;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #050506, #242428 58%, #08080a);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    .hardware-button.silent { left: -3px; top: 175px; height: 34px; }
    .hardware-button.volume-up { left: -3px; top: 225px; height: 62px; }
    .hardware-button.volume-down { left: -3px; top: 299px; height: 62px; }
    .hardware-button.power { right: -3px; top: 252px; height: 104px; }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .dynamic-island {
      position: absolute;
      z-index: 20;
      top: 11px;
      left: 50%;
      width: 126px;
      height: 37px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #000;
      box-shadow: inset 0 -1px 1px rgba(255,255,255,.05);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      top: 0;
      left: 0;
      right: 0;
      height: var(--phone-safe-top);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 18px 27px 0;
      color: var(--phone-system-fg);
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.01em;
      pointer-events: none;
    }
    .status-icons { display: inline-flex; align-items: center; gap: 6px; }
    .status-icons svg { display: block; width: 17px; height: 11px; fill: currentColor; }
    .status-icons .battery { width: 25px; }

    .home-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 134px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--phone-system-fg);
      opacity: .9;
      pointer-events: none;
    }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 939px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 851px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 781px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 711px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
      /* fullbleed: never less than the supplied shell padding, but honour the
         device's own safe insets where they are larger. */
      .phone-content {
        padding-top: max(var(--phone-safe-top), env(safe-area-inset-top, 0px));
        padding-bottom: max(var(--phone-safe-bottom), env(safe-area-inset-bottom, 0px));
      }
    }

/* =====================================================================
   OpenRecord — product styles. Everything below is app-owned and is not
   part of the presentation shell.
   ===================================================================== */
:root{
  --bg:#171b20; --surface:#252c33; --surface-2:#2f383f;
  --text:#f5f0e6; --muted:#bcc4cb; --accent:#ff8d83; --border:#56616c;
  --ivory:#efe5cf; --ink:#16181c;
  --r:8px; --ease:cubic-bezier(.23,1,.32,1);
  --font-display:Georgia,"Times New Roman",serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.phone-content{
  /* the app owns the viewport: screens scroll internally, chrome stays put */
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);}

.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-fill{fill:none;stroke:currentColor}
.ic-tag{stroke-width:2}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- chrome ---------- */
.topbar{
  display:flex;align-items:center;gap:8px;min-width:0;
  min-height:56px;padding:0 8px;
  background:var(--bg);border-bottom:1px solid rgba(86,97,108,.5);
}
.brand-mark{
  flex:none;width:30px;height:30px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 50%, #0b0d10 0 30%, #2b333b 31% 60%, #0b0d10 61%);
  border:1px solid var(--border);
}
.brand-mark::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--accent)}
.brand-txt{display:grid;min-width:0}
.brand-name{font-family:var(--font-display);font-size:20px;line-height:1.15}
.brand-tag{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

.dock{display:flex;flex-direction:column;background:var(--bg)}
.screen-host{position:relative;min-height:0;background:var(--bg)}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  scrollbar-width:none;padding:12px 16px 24px;
  opacity:0;transform:translateY(8px);pointer-events:none;visibility:hidden;
  transition:opacity 140ms var(--ease),transform 140ms var(--ease),visibility 0s linear 140ms;
}
.screen::-webkit-scrollbar{display:none}
.screen.is-active{
  opacity:1;transform:none;pointer-events:auto;visibility:visible;
  transition:opacity 200ms var(--ease),transform 200ms var(--ease),visibility 0s linear 0s;
}

/* ---------- type ---------- */
.serif{font-family:var(--font-display)}
.t-display{font-size:32px;line-height:1.15;margin:0}
.t-h1{font-size:24px;line-height:1.2;margin:0}
.t-h2{font-size:20px;line-height:1.25;margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:14px;margin:0 0 10px}
.note{font-size:12px;color:var(--muted);margin:14px 0 0}
.grow{flex:1 1 0;min-width:0}

/* ---------- buttons ---------- */
.btn{
  appearance:none;font:inherit;font-size:15px;color:var(--text);
  background:var(--surface);border:1px solid rgba(86,97,108,.75);
  min-height:44px;padding:0 14px;border-radius:var(--r);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background 140ms var(--ease),transform 140ms var(--ease),opacity 140ms var(--ease);
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#2a1210;font-weight:600}
.btn-primary:hover{background:#ffa098}
.btn-danger{color:var(--accent);border-color:rgba(255,141,131,.55);background:rgba(255,141,131,.08)}
.btn-danger:hover{background:rgba(255,141,131,.16)}
.btn-sm{font-size:14px;padding:0 12px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}

.iconbtn{
  appearance:none;flex:none;width:44px;height:44px;border:0;background:transparent;
  color:var(--text);border-radius:var(--r);display:grid;place-items:center;cursor:pointer;
  transition:background 140ms var(--ease),transform 140ms var(--ease);
}
.iconbtn:hover{background:rgba(255,255,255,.07)}
.iconbtn:active{transform:scale(.94)}
.iconbtn[aria-pressed="true"]{color:var(--accent)}

.chip{
  appearance:none;font:inherit;font-size:13px;color:var(--muted);white-space:nowrap;
  background:transparent;border:1px solid rgba(86,97,108,.7);border-radius:999px;
  min-height:44px;padding:0 14px;cursor:pointer;flex:none;
  transition:background 140ms var(--ease),color 140ms var(--ease),border-color 140ms var(--ease);
}
.chip:hover{color:var(--text)}
.chip.is-on{background:var(--ivory);color:var(--ink);border-color:var(--ivory);font-weight:600}

.tag{
  display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 9px;
  border-radius:999px;background:rgba(255,255,255,.06);
  border:1px solid rgba(86,97,108,.55);color:var(--muted);
  font-size:11px;letter-spacing:.03em;white-space:nowrap;
}
.tag-ivory{background:var(--ivory);color:var(--ink);border-color:transparent;font-weight:600}

/* ---------- forms ---------- */
.field{display:grid;gap:4px}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=search],select{
  width:100%;min-height:44px;background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:var(--r);padding:0 10px;font:inherit;
  outline:none;transition:border-color 140ms var(--ease);
}
input[type=search]{-webkit-appearance:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
input[type=text]:focus,input[type=search]:focus,select:focus{border-color:var(--accent)}
input[aria-invalid="true"]{border-color:var(--accent)}
.field-err{color:var(--accent);font-size:12px;margin:0;min-height:1.1em}
.search-field{
  display:flex;align-items:center;gap:8px;min-height:48px;padding:0 8px;margin:0 0 4px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  transition:border-color 140ms var(--ease);
}
.search-field:focus-within{border-color:var(--accent)}
.od-icon-large{--od-icon-size:24px}
.od-icon-small{--od-icon-size:13px}
.od-icon-play{--od-icon-size:30px}
.od-icon-status{--od-icon-size:18px}
.search-field .ic{color:var(--muted);flex:none}
.search-field input{flex:1 1 0;min-width:0;border:0;background:transparent;min-height:44px}

/* ---------- browse ---------- */
.editorial-head{margin:2px 0 14px}
.editorial-kicker{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:var(--muted);font-size:11px;letter-spacing:.16em}
.editorial-kicker span:last-child{color:var(--accent)}
.editorial-head .t-display{margin-bottom:5px}
.compact-head{margin:2px 0 16px}
.booth{
  display:grid;gap:10px;padding:12px;border-radius:var(--r);
  background:var(--surface);
  border:1px solid rgba(86,97,108,.55);
}
.booth-stage{position:relative;aspect-ratio:1.34/1;overflow:hidden}
.disc{
  border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%, #0b0d10 0 2px, #1c2229 2px 3.5px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), 0 10px 24px rgba(0,0,0,.5);
}
.disc-label{
  position:absolute;left:50%;top:50%;width:31%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--ivory);color:var(--ink);
  display:grid;place-items:center;font:600 9px/1 var(--font-body);letter-spacing:.03em;
}
.disc-label::after{content:"";width:12%;aspect-ratio:1;border-radius:50%;background:#0b0d10;position:absolute}
.booth-stage .disc{position:absolute;right:0;top:7%;width:74%;aspect-ratio:1;z-index:1}
.booth-stage .sleeve{
  position:absolute;left:0;top:0;width:68%;aspect-ratio:1;z-index:2;
  background:var(--ivory);padding:5px;border-radius:3px;
  box-shadow:0 16px 30px rgba(0,0,0,.55);
}
.booth-stage .sleeve img{width:100%;height:100%;object-fit:contain;background:var(--surface);display:block}
.booth-stage .sleeve .art-fallback{width:100%;height:100%}
.booth-stage.is-spinning .disc{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.booth-info h2{margin:3px 0;font-size:24px;line-height:1.2}
.booth-info{padding:2px 2px 0}
.bin-head{margin-top:20px}
.record-main{padding-inline:8px}
.screen{scrollbar-width:none}
button,.btn,.iconbtn,.chip,.tab{min-height:44px}
@media(max-width:480px){body{padding:0;background:var(--bg)}.phone-frame{width:100vw;height:100dvh}.phone-content{border-radius:0!important}.screen{padding-top:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
.booth-sub{margin:0;font-size:14px}

.bins{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:12px 16px 4px;margin:0 -16px;
}
.bins::-webkit-scrollbar{display:none}

.bin-head{display:flex;align-items:center;gap:8px;margin:16px 0 2px}
.bin-head h2{font-family:var(--font-display);font-size:18px;font-weight:600;margin:0}
.bin-head .rule{flex:1 1 auto;height:1px;background:rgba(86,97,108,.55)}

.crate,.tracks{display:grid}
.record{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;
  padding:2px 0;border-top:1px solid rgba(86,97,108,.32);
}
.crate > .record:first-child,.tracks > .track:first-child{border-top:0}
.record-main,.track-main{
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;
  background:transparent;border:0;color:inherit;font:inherit;text-align:left;
  cursor:pointer;padding:4px;border-radius:var(--r);min-width:0;
  transition:background 140ms var(--ease);
}
.record-main{min-height:72px}
.track-main{min-height:60px}
.record-main:hover,.track-main:hover{background:rgba(255,255,255,.05)}
.record-title{font-size:15px;font-weight:600;line-height:1.3}
.track-title{font-size:14px;font-weight:600;line-height:1.3}
.record-artist{font-size:13px;color:var(--muted)}
.record-detail{font-size:12px;color:var(--muted);letter-spacing:.02em}
.record-tags,.np-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.record.is-current .record-title,.track.is-current .track-title{color:var(--accent)}

.sleeve-thumb{position:relative;flex:none;--s:60px;width:calc(var(--s) + 10px);height:var(--s)}
.sleeve-thumb .disc{
  position:absolute;z-index:1;
  width:calc(var(--s)*.76);height:calc(var(--s)*.76);
  left:calc(var(--s)*.42);top:calc(var(--s)*.12);
}
.sleeve-thumb .art{
  position:absolute;z-index:2;left:0;top:0;width:var(--s);height:var(--s);
  background:var(--ivory);padding:3px;border-radius:2px;box-shadow:0 4px 10px rgba(0,0,0,.4);
}
.sleeve-thumb .art img{width:100%;height:100%;object-fit:contain;background:var(--surface);display:block}
/* designed fallback for a missing cover file: a vinyl disc with the centre
   label, never a fake sleeve and never a broken-image glyph */
.art-fallback{
  position:relative;display:block;width:100%;height:100%;border-radius:2px;overflow:hidden;
  background:repeating-radial-gradient(circle at 50% 50%, #0b0d10 0 2px, #1c2229 2px 3.5px);
}
.art-fallback .art-label{
  position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--ivory);color:var(--ink);
  display:grid;place-items:center;font:600 8px/1 var(--font-body);letter-spacing:.02em;
}
.np-art .art-fallback{height:auto;aspect-ratio:3/4}
.art-fallback[hidden]{display:none}
.mini-art .art-label{display:none}

/* ---------- playlists / members ---------- */
.pl-head{margin:2px 0 10px}
.pl-actions{margin:2px 0 6px}
.pl-list,.members{display:grid;gap:8px}
.pl-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;
  background:var(--surface);border:1px solid rgba(86,97,108,.5);border-radius:var(--r);
  min-height:64px;padding:8px 10px 8px 12px;text-align:left;color:inherit;font:inherit;cursor:pointer;
  transition:background 140ms var(--ease);
}
.pl-row:hover{background:var(--surface-2)}
.pl-name{font-family:var(--font-display);font-size:18px}
.pl-meta{font-size:12px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid rgba(86,97,108,.5);border-radius:var(--r);padding:12px}
.panel + .panel,.panel + .bin-head{margin-top:12px}
.banner,.member,.add-row{display:grid;align-items:center;gap:8px}
.banner{
  grid-template-columns:auto minmax(0,1fr);margin:8px 0;
  padding:8px 10px;border-radius:var(--r);
  background:rgba(255,141,131,.10);border:1px solid rgba(255,141,131,.42);
}
.banner .ic{color:var(--accent)}
.banner p{margin:0;font-size:13px;line-height:1.45}
.member{
  grid-template-columns:minmax(0,1fr) auto auto;
  background:var(--surface);border:1px solid rgba(86,97,108,.5);border-radius:var(--r);padding:8px 10px;
}
.member-name{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.member-role{font-size:12px;color:var(--muted)}
.member select{width:auto;min-width:98px;min-height:44px;font-size:14px}

.empty{
  color:var(--muted);font-size:14px;text-align:center;
  padding:20px 12px;border:1px dashed rgba(86,97,108,.55);border-radius:var(--r);
}

/* ---------- now playing ---------- */
.np-stage{position:relative;padding-right:14%;margin:6px 0 16px}
.np-stage .disc{position:absolute;right:0;top:9%;width:62%;aspect-ratio:1;z-index:0}
.np-stage.is-spinning .disc{animation:spin 8s linear infinite}
.np-art{
  position:relative;z-index:1;width:86%;
  background:var(--ivory);padding:6px;border-radius:3px;
  box-shadow:0 18px 34px rgba(0,0,0,.55);
}
.np-art img{display:block;width:auto;max-width:100%;max-height:44vh;height:auto;margin:0 auto;object-fit:contain;background:var(--surface)}
.np-artist{color:var(--muted);font-size:15px;margin:4px 0 6px}
.np-status{min-height:24px;margin:2px 0}
.status-load,.status-bad{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.status-load{color:var(--muted)}
.status-bad{color:var(--accent)}

.seek{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:36px;text-align:center}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;cursor:pointer;
  background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) var(--p,0%), rgba(86,97,108,.7) var(--p,0%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(86,97,108,.7)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}

.transport{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:10px 0 4px}
.tbtn{
  appearance:none;flex:none;width:52px;height:52px;border-radius:50%;
  background:var(--surface);border:1px solid rgba(86,97,108,.75);color:var(--text);
  display:grid;place-items:center;cursor:pointer;
  transition:background 140ms var(--ease),transform 140ms var(--ease);
}
.tbtn:hover{background:var(--surface-2)}
.tbtn:active{transform:scale(.94)}
.tbtn[aria-pressed="true"]{color:var(--accent);border-color:rgba(255,141,131,.55)}
.tbtn-main{width:68px;height:68px;background:var(--accent);border-color:var(--accent);color:#2a1210}
.tbtn-main:hover{background:#ffa098}


/* ---------- mini player ---------- */
.miniplayer{
  position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;
  align-items:center;gap:6px;padding:6px 6px 6px 8px;
  background:var(--surface);border-top:1px solid rgba(86,97,108,.6);
}
.miniplayer[hidden]{display:none}
.mini-bar{position:absolute;left:0;right:0;top:-1px;height:2px;background:rgba(86,97,108,.5)}
.mini-bar span{display:block;height:100%;width:0;background:var(--accent);transition:width 200ms linear}
.mini-art{
  position:relative;flex:none;width:44px;height:44px;padding:2px;border:0;border-radius:3px;
  background:var(--ivory);cursor:pointer;
}
.mini-art img{width:100%;height:100%;object-fit:contain;background:var(--surface);display:block}
.mini-load,.mini-err{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,13,16,.72);border-radius:2px}
.mini-load[hidden],.mini-err[hidden]{display:none}

.mini-err{color:var(--accent)}
.mini-info{background:transparent;border:0;color:inherit;font:inherit;text-align:left;padding:0 4px;min-width:0;cursor:pointer;border-radius:var(--r)}
.mini-title{display:block;font-size:14px;font-weight:600;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mini-artist{display:block;font-size:12px;color:var(--muted)}

/* ---------- tabs ---------- */
.tabbar{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px 8px 6px;
  background:var(--bg);border-top:1px solid rgba(86,97,108,.5);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:48px;border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:inherit;font-size:11px;letter-spacing:.04em;border-radius:var(--r);
  transition:color 140ms var(--ease),background 140ms var(--ease);
}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] .ic{color:var(--accent)}

/* ---------- overlays ---------- */
.modal-backdrop{
  position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:16px;
  background:rgba(9,11,14,.68);
}
.modal-backdrop[hidden]{display:none}
.modal{
  width:100%;max-width:336px;max-height:82%;overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;display:grid;gap:12px;
  box-shadow:0 24px 50px rgba(0,0,0,.55);
}
.modal h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0}
.modal-actions{display:grid;gap:8px}
.add-list{display:grid;max-height:42vh;overflow:auto}
.add-row{grid-template-columns:minmax(0,1fr) auto;padding:6px 0;border-top:1px solid rgba(86,97,108,.3)}
.add-row:first-child{border-top:0}
.add-title{font-size:14px;font-weight:600;line-height:1.25}

.toast{
  position:absolute;left:50%;z-index:40;max-width:82%;text-align:center;
  bottom:calc(var(--phone-safe-bottom) + 14px);
  transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:var(--ivory);color:var(--ink);font-size:14px;font-weight:500;
  padding:9px 14px;border-radius:var(--r);
  transition:opacity 140ms var(--ease),transform 140ms var(--ease);
}
.toast.is-on{opacity:1;transform:translate(-50%,0);transition-duration:200ms var(--ease)}

@keyframes rot{to{transform:rotate(360deg)}}
.spin{animation:rot 900ms linear infinite}

@media (prefers-reduced-motion: reduce){
  .screen,.screen.is-active,.toast,.modal,.btn,.iconbtn,.chip,.tbtn,.tab,.pl-row,.record-main,.track-main,.mini-bar span{
    transition-duration:1ms !important;
  }
  .screen:not(.is-active){transform:none}
  .booth-stage.is-spinning .disc,.np-stage.is-spinning .disc{animation:none}
}
</style>

function h(tag,attrs){
  var kids=Array.prototype.slice.call(arguments,2);

  if(attrs){for(var k in attrs){
    var v=attrs[k];
    if(v==null||v===false)continue;
    if(k==="class")n.className=v;
    else if(k==="text")n.textContent=String(v);
    else if(k.slice(0,2)==="on"&&typeof v==="function")n.addEventListener(k.slice(2),v);
    else if(v===true)n.setAttribute(k,"");

  kids.forEach(function add(c){
    if(c==null||c===false)return;
    if(Array.isArray(c)){c.forEach(add);return;}
    n.appendChild(c.nodeType?c:document.createTextNode(String(c)));
  });
  return n;
}
function icon(name,cls){
  var s=document.createElementNS(NS,"svg");
  s.setAttribute("class","od-icon od-icon-large ic"+(cls?" "+cls:""));
  if((name==="i-play"||name==="i-pause")&&cls&&cls.indexOf("ic-fill")>=0)s.classList.add("od-icon-play");
  if(cls&&cls.indexOf("ic-tag")>=0)s.classList.add("od-icon-small");
  s.setAttribute("aria-hidden","true");s.setAttribute("focusable","false");
  var u=document.createElementNS(NS,"use");u.setAttribute("href","#"+name);s.appendChild(u);
  return s;
}
function fmt(s){
  if(!isFinite(s)||s<0)s=0;
  var m=Math.floor(s/60),x=Math.floor(s%60);
  return m+":"+(x<10?"0":"")+x;
}
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------------- artwork, with a designed fallback when a file is missing ----------------
   A broken cover never renders as a fake sleeve or a broken-image glyph: it
   becomes a vinyl disc with the record's centre label, and the failed URL is
   remembered so a re-render does not re-request the same missing asset. */
var artFailed={};
function artCode(t){return String(t.cat).replace(/[^0-9]/g,"")||String(t.cat);}
function artFallback(t){
  return h("span",{class:"art-fallback","data-art-fallback":true,role:"img",
    "aria-label":"Sleeve artwork unavailable for "+t.title+" by "+t.artist+". Showing the vinyl centre label "+t.cat+"."},
    h("span",{class:"art-label","aria-hidden":"true"},artCode(t)));
}
/* The failed <img> stays in the DOM (hidden via inline style, which beats the
   author display:block rules) and the fallback is inserted beside it, so the
   surface keeps its structure and never re-requests the missing file. */
function showArtFallback(host,t){
  if(!host)return;
  var img=host.querySelector("img");
  if(img){img.hidden=true;img.style.display="none";}
  var fb=host.querySelector(".art-fallback");
  if(!fb){fb=artFallback(t);host.appendChild(fb);}
  fb.setAttribute("aria-label","Sleeve artwork unavailable for "+t.title+" by "+t.artist+". Showing the vinyl centre label "+t.cat+".");
  var label=fb.querySelector(".art-label");if(label)label.textContent=artCode(t);
  fb.hidden=false;fb.style.display="";
}
function artMedia(t){
  if(artFailed[t.art])return artFallback(t);
  var img=h("img",{class:"art-img",src:t.art,alt:t.artAlt||"",width:String(t.artW),height:String(t.artH),loading:"lazy",decoding:"async"});
  img.addEventListener("error",function(){
    var src=img.getAttribute("src")||"";
    var active=currentTrack();
    var failed=active&&src.indexOf(active.art)>=0?active:null;
    if(!failed){for(var i=0;i<CATALOG.length;i++){if(src.indexOf(CATALOG[i].art)>=0){failed=CATALOG[i];break;}}}
    if(!failed)return;
    artFailed[failed.art]=true;
    showArtFallback(img.parentNode,failed);
    syncPlayerUI();
  });
  return img;
}
/* in-place update for surfaces that are not rebuilt on every render */
function setArt(host,t){
  if(!host||!t)return;
  if(artFailed[t.art]){showArtFallback(host,t);return;}
  var img=host.querySelector("img");
  if(!img){host.replaceChildren(artMedia(t));return;}
  if(img.src.indexOf(t.art)<0)img.src=t.art;
  if(img.getAttribute("alt")!==(t.artAlt||""))img.alt=t.artAlt||"";
  /* a record whose artwork loads again must not keep a hidden <img> or a stale label */
  img.hidden=false;
  img.style.display="";
  var stale=host.querySelector(".art-fallback");

function getPlaylist(id){
  for(var i=0;i<state.playlists.length;i++)if(state.playlists[i].id===id)return state.playlists[i];

function viewerName(pl){
  if(state.viewingAs==="owner")return "You";

function roleFor(pl){

}
function canManageTracks(pl){var r=roleFor(pl);return r==="owner"||r==="editor";}

function trackMenu(pl,index){
  var t=trackById(pl.tracks[index]);

      onclick:function(){closeModal();moveTrack(pl,index,1);}},"Move down"));

      onclick:function(){closeModal();removeTrack(pl,index);}},"Remove from playlist"));

    acts.push(h("p",{class:"muted",style:"margin:0;font-size:14px"},
      "Viewers can play this playlist but cannot change its record order."));

function moveTrack(pl,index,dir){
  var j=index+dir;

  focusAfter('[data-options="'+tmp+'"]');
  renderPlaylist();toast("Record moved");

function removeTrack(pl,index){
  var t=trackById(pl.tracks[index]);

  renderPlaylist();toast("Removed “"+(t?t.title:"record")+"”");

/* ---------------- navigation ---------------- */
var screenFns={browse:renderBrowse,search:renderSearch,library:renderLibrary,
  playlist:renderPlaylist,collab:renderCollab,now:renderNow};
var prevName=null;
function go(name,params){
  var cur=state.stack[state.stack.length-1];
  if(cur&&cur.name===name)cur.params=params||{};
  else state.stack.push({name:name,params:params||{}});
  render();
}
function switchTab(name){
  state.stack=[{name:name,params:{}}];
  state.viewingAs="owner";
  render();
}
function back(){
  if(state.stack.length>1)state.stack.pop();
  else state.stack=[{name:"browse",params:{}}];
  render();
}
function titleFor(name,params){
  if(name==="playlist"){var pl=getPlaylist(params.playlistId);return pl?pl.name:"Playlist";}
  if(name==="collab")return "Collaborators";
  if(name==="now")return "Now playing";
  return "";
}
function renderTopbar(){
  var tb=$("#topbar");tb.replaceChildren();
  var cur=state.stack[state.stack.length-1];
  if(state.stack.length>1){
    tb.appendChild(h("button",{class:"iconbtn",type:"button","aria-label":"Back",onclick:back},
      icon(cur.name==="now"?"i-chev-down":"i-back")));
  }
  if(ROOTS.indexOf(cur.name)>=0){
    tb.appendChild(h("span",{class:"brand-mark","aria-hidden":"true"}));
    tb.appendChild(h("div",{class:"brand-txt od-cell"},
      h("span",{class:"brand-name"},"OpenRecord"),
      h("span",{class:"brand-tag"},"Vintage records · listening room")));
  }else{
    tb.appendChild(h("h1",{class:"t-h2 serif grow od-truncate"},titleFor(cur.name,state.params)));
    if(cur.name==="playlist"){
      tb.appendChild(h("button",{class:"iconbtn",type:"button","aria-label":"Collaborators and sharing",
        onclick:function(){openCollaborators(state.params.playlistId);}},icon("i-users")));
    }
  }
}
function render(){
  var cur=state.stack[state.stack.length-1];
  state.name=cur.name;state.params=cur.params||{};
  $$("#tabbar .tab").forEach(function(b){
    if(b.getAttribute("data-tab")===cur.name)b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  var target=null;
  $$(".screen").forEach(function(s){
    var on=s.getAttribute("data-screen")===cur.name;
    s.classList.toggle("is-active",on);
    s.setAttribute("aria-hidden",String(!on));
    if("inert" in s)s.inert=!on;
    if(on)target=s;
  });
  renderTopbar();
  if(target&&cur.name!==prevName)target.scrollTop=0;
  prevName=cur.name;
  var fn=screenFns[cur.name];
  if(fn)fn();
  syncPlayerUI();
  applyPendingFocus();
}

});
